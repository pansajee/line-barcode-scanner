<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สแกนบาร์โค้ดพัสดุ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f6f8;
      color: #1f2937;
    }
    .card {
      max-width: 480px;
      margin: 0 auto 14px;
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .user-info {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 12px;
    }
    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: #06c755;
      color: #fff;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .result-row {
      margin: 6px 0;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      background: #ecfdf5;
      color: #065f46;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>สแกนบาร์โค้ด / QR พัสดุ</h2>
    <div id="userInfo" class="user-info">กำลังเชื่อมต่อ LINE LIFF...</div>
    <div id="reader"></div>
    <div class="controls">
      <button id="btnStart" class="btn-primary" onclick="startScanner()">เริ่มสแกน</button>
      <button id="btnStop" class="btn-secondary" onclick="stopScanner()">หยุดกล้อง</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h2>ผลลัพธ์การสแกน</h2>
    <div id="resultContent"></div>
  </div>

  <script>
    const LIFF_ID = "2012811618-TzekgNhz";
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxuW0zU9gOAGxdQjMRwkPmhMn-Z3Rs9_J0r2dKE7RhbN7NY5CDPWUsVG4HvqoT4R1dT/exec";

    let html5QrCode = null;
    let lineProfileName = "LINE User";
    let isProcessing = false;

    async function initApp() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        lineProfileName = profile.displayName || "LINE User";
        document.getElementById("userInfo").textContent = "ผู้ใช้งาน: " + lineProfileName;
        await startScanner();
      } catch (err) {
        document.getElementById("userInfo").textContent = "เปิดโหมดทดสอบนอก LIFF (" + err.message + ")";
        await startScanner();
      }
    }

    async function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      if (html5QrCode.isScanning) return;

      isProcessing = false;
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 140 } },
          onScanSuccess,
          () => {}
        );
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้: " + err);
      }
    }

    async function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const cleanCode = (decodedText || "").trim().toUpperCase();
      await stopScanner();
      renderLoading(cleanCode);

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "scan_log",
            barcode: cleanCode,
            scanned_by: lineProfileName,
            status: "สแกนตรวจสอบแล้ว"
          })
        });

        const result = await response.json();
        renderResult(cleanCode, result);
      } catch (err) {
        renderError(cleanCode, "เชื่อมต่อ Google Apps Script ไม่สำเร็จ: " + err.message);
      }
    }

    function renderLoading(code) {
      const card = document.getElementById("resultCard");
      const content = document.getElementById("resultContent");
      card.style.display = "block";
      content.innerHTML = `<div class="result-row">กำลังค้นหาและบันทึกเลข: <b>${escapeHtml(code)}</b>...</div>`;
    }

    function renderResult(code, result) {
      const card = document.getElementById("resultCard");
      const content = document.getElementById("resultContent");
      card.style.display = "block";

      if (!result.ok) {
        renderError(code, result.message || "เกิดข้อผิดพลาด");
        return;
      }

      const d = result.data || {};
      content.innerHTML = `
        <div class="result-row"><span class="badge">${escapeHtml(result.message || "สำเร็จ")}</span></div>
        <div class="result-row"><b>เลขพัสดุ:</b> ${escapeHtml(d.barcode || code)}</div>
        <div class="result-row"><b>เลขคำสั่งซื้อ:</b> ${escapeHtml(d.order_id || "-")}</div>
        <div class="result-row"><b>ชื่อผู้รับ:</b> ${escapeHtml(d.customer || "-")}</div>
        <div class="result-row"><b>สถานะ:</b> ${escapeHtml(d.status || "-")}</div>
        <div class="result-row"><b>ผู้สแกน:</b> ${escapeHtml(d.scanned_by || lineProfileName)}</div>
        <div class="result-row"><b>เวลาอัปเดต:</b> ${escapeHtml(d.updated_at || "-")}</div>
        <div class="controls">
          <button class="btn-primary" onclick="startScanner()">สแกนรายการถัดไป</button>
        </div>
      `;
    }

    function renderError(code, message) {
      const card = document.getElementById("resultCard");
      const content = document.getElementById("resultContent");
      card.style.display = "block";
      content.innerHTML = `
        <div class="result-row"><b>เลขที่อ่านได้:</b> ${escapeHtml(code)}</div>
        <div class="result-row" style="color:#b91c1c;">${escapeHtml(message)}</div>
        <div class="controls">
          <button class="btn-primary" onclick="startScanner()">ลองสแกนใหม่อีกครั้ง</button>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    initApp();
  </script>
</body>
</html>
